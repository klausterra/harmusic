<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07130e"/>
      <stop offset="100%" stop-color="#0b1c15"/>
    </linearGradient>
    <linearGradient id="favMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eafff6"/>
      <stop offset="50%" stop-color="#5cff9d"/>
      <stop offset="100%" stop-color="#00e6b8"/>
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4d4"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#favBg)"/>
  <rect width="62" height="62" x="1" y="1" rx="14" fill="none" stroke="rgba(92,255,157,0.25)" stroke-width="1"/>

  <!-- Left stem -->
  <rect x="16" y="16" width="5.5" height="32" rx="2.75" fill="url(#favMint)"/>
  <!-- Right stem -->
  <rect x="42.5" y="16" width="5.5" height="32" rx="2.75" fill="url(#favMint)"/>
  <!-- Wave crossbar -->
  <path d="M19 33.5 C 24 30, 30 30, 35 33 C 38 35, 41 34, 45 31.5"
        fill="none" stroke="url(#favMint)" stroke-width="5" stroke-linecap="round"/>
  <!-- Note head -->
  <circle cx="33" cy="34" r="4.8" fill="url(#favGold)"/>
  <!-- Flag -->
  <path d="M45 18 C 49 19, 52 22, 52 26 C 49 24, 47 23.5, 45 23.5 Z" fill="url(#favGold)"/>
</svg>
